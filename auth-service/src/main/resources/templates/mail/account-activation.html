<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background:#0b0b0b; color:#f5f5f5; padding:24px;">
<div style="max-width:480px;margin:0 auto;">
    <img th:src="${logoUrl}" alt="ClickDrop" width="140" style="margin-bottom:24px;" />

    <h1 style="font-size:20px;">Welcome, <span th:text="${username}">user</span>!</h1>

    <p>Thanks for joining ClickDrop. Confirm your email to activate your account:</p>

    <p style="margin:28px 0;">
        <a th:href="${activationLink}"
           style="background:#f59e0b;color:#111;padding:12px 18px;text-decoration:none;border-radius:6px;font-weight:bold;">
            Activate account
        </a>
    </p>

    <p style="font-size:12px;color:#aaa;">
        Or paste this link into your browser:<br/>
        <span th:text="${activationLink}"></span>
    </p>
</div>
</body>
</html>
