<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Confirm your ClickDrop account</title>
</head>
<body style="margin:0;padding:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#0b0b0b;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;width:100%;">
                <tr>
                    <td style="padding:8px 0 24px;font-size:22px;font-weight:bold;letter-spacing:0.08em;color:#f59e0b;">
                        CLICKDROP
                    </td>
                </tr>
                <tr>
                    <td style="font-size:20px;font-weight:bold;color:#f5f5f5;padding-bottom:12px;">
                        Welcome, <span th:text="${username}">user</span>!
                    </td>
                </tr>
                <tr>
                    <td style="font-size:15px;line-height:1.5;color:#d4d4d4;padding-bottom:28px;">
                        Thanks for joining ClickDrop. Confirm your email to activate your account.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding-bottom:28px;">
                        <!--[if mso]>
                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                                     th:href="${activationLink}" style="height:44px;v-text-anchor:middle;width:200px;" arcsize="10%" stroke="f" fillcolor="#f59e0b">
                            <w:anchorlock/>
                            <center style="color:#111111;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;">
                                Activate account
                            </center>
                        </v:roundrect>
                        <![endif]-->
                        <!--[if !mso]><!-- -->
                        <a th:href="${activationLink}"
                           href="#"
                           target="_blank"
                           rel="noopener noreferrer"
                           style="display:inline-block;background:#f59e0b;color:#111111;padding:14px 22px;text-decoration:none;border-radius:6px;font-weight:bold;font-size:14px;line-height:1;">
                            Activate account
                        </a>
                        <!--<![endif]-->
                    </td>
                </tr>
                <tr>
                    <td style="font-size:12px;line-height:1.5;color:#aaaaaa;">
                        Or open this link in your browser:<br/>
                        <a th:href="${activationLink}"
                           th:text="${activationLink}"
                           href="#"
                           target="_blank"
                           rel="noopener noreferrer"
                           style="color:#f59e0b;word-break:break-all;text-decoration:underline;">
                            activation link
                        </a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
